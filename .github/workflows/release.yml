name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$GITHUB_REF_NAME is not a version tag like v1.2.3 or v1.2.3-beta.1"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            file: libquark.so
          - os: windows-2025
            file: quark.dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Set the version
        shell: bash
        run: sed -i -E '/^\[workspace\.package\]/,/^\[/ s/^version = "[^"]*"/version = "${{ needs.version.outputs.version }}"/' Cargo.toml

      - name: Build
        run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}
          path: target/release/${{ matrix.file }}
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: binaries
          merge-multiple: true

      - name: Assemble the package
        run: |
          mkdir -p dist/quark
          cp packages/quark/Package.toml dist/quark/
          sed -i -E '/^\[meta\]/,/^\[/ s/^(\s*version\s*=\s*)"[^"]*"/\1"'"$VERSION"'"/' dist/quark/Package.toml
          grep -q "\"$VERSION\"" dist/quark/Package.toml
          cp binaries/libquark.so binaries/quark.dll dist/quark/
          (cd dist && zip -r "quark-$VERSION.zip" quark)
          (cd library && zip -r "../dist/quark-library-$VERSION.zip" .)
          (cd dist && sha256sum "quark-$VERSION.zip" "quark-library-$VERSION.zip" > SHA256SUMS)

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/quark-${{ env.VERSION }}.zip
            dist/quark-library-${{ env.VERSION }}.zip

      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            dist/quark-${{ env.VERSION }}.zip
            dist/quark-library-${{ env.VERSION }}.zip
            dist/SHA256SUMS
