[workspace]
resolver = "3"
members = ["crates/*", "quark"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
quark-core = { path = "crates/quark-core" }
quark-compression = { path = "crates/quark-compression" }
quark-crypto = { path = "crates/quark-crypto" }
quark-formats = { path = "crates/quark-formats" }
quark-testing = { path = "crates/quark-testing" }

mlua = { version = "0.12.2", features = ["lua54", "module"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time"] }

aes-gcm = "0.11.1"
argon2 = "0.6.0"
bcrypt = "0.19.3"
blake3 = "1.8.7"
chacha20poly1305 = "0.11.0"
data-encoding = "2.11.1"
ed25519-dalek = { version = "3.0.0", features = ["pkcs8", "pem"] }
getrandom = { version = "0.4.3", features = ["sys_rng"] }
hkdf = "0.13.0"
hmac = "0.13.0"
md-5 = "0.11.0"
p256 = { version = "0.14.0", features = ["ecdsa", "ecdh", "pem"] }
p384 = { version = "0.14.0", features = ["ecdsa", "ecdh", "pem"] }
pbkdf2 = "0.13.0"
pkcs8 = { version = "0.11.0", features = ["encryption", "getrandom", "pem"] }
rand_core = "0.10.1"
rsa = { version = "0.10.0-rc.19", features = ["sha2"] }
scrypt = { version = "0.12.0", features = ["phc", "getrandom"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
sha3 = "0.12.0"
subtle = "2.6.1"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }

ciborium = "0.2.2"
csv = "1.4.0"
percent-encoding = "2.3.2"
rmpv = { version = "1.3.1", features = ["with-serde"] }
serde = "1"
serde-saphyr = "2.0.0"
toml = "1.1.8"
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v4", "v7"] }

brotli = "9.0.0"
flate2 = "1.1.10"
lz4_flex = "0.14.0"
tar = "0.4.46"
zip = { version = "9.1.0", default-features = false, features = ["deflate-flate2"] }
zstd = { version = "0.14.3", default-features = false }

bs58 = "0.5.1"
jsonschema = { version = "0.60.1", default-features = false }
quick-xml = "0.42.0"
rust-ini = "0.21.3"

libc = "0.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

[profile.release]
lto = "thin"
codegen-units = 1
