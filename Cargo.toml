[workspace]
resolver = "3"
members = ["crates/*", "quark"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
quark-core = { path = "crates/quark-core" }
quark-compression = { path = "crates/quark-compression" }
quark-crypto = { path = "crates/quark-crypto" }
quark-formats = { path = "crates/quark-formats" }
quark-locale = { path = "crates/quark-locale" }
quark-math = { path = "crates/quark-math" }
quark-messaging = { path = "crates/quark-messaging" }
quark-net = { path = "crates/quark-net" }
quark-random = { path = "crates/quark-random" }
quark-redis = { path = "crates/quark-redis" }
quark-text = { path = "crates/quark-text" }
quark-time = { path = "crates/quark-time" }
quark-utilities = { path = "crates/quark-utilities" }
quark-testing = { path = "crates/quark-testing" }

mlua = { version = "0.12.2", features = ["lua54", "module"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time", "net", "io-util", "sync", "macros", "fs"] }

aes-gcm = "0.11.1"
argon2 = "0.6.0"
bcrypt = "0.19.3"
blake3 = "1.8.7"
chacha20poly1305 = "0.11.0"
data-encoding = "2.11.1"
ed25519-dalek = { version = "3.0.0", features = ["pkcs8", "pem"] }
getrandom = { version = "0.4.3", features = ["sys_rng"] }
hkdf = "0.13.0"
hmac = "0.13.0"
md-5 = "0.11.0"
p256 = { version = "0.14.0", features = ["ecdsa", "ecdh", "pem"] }
p384 = { version = "0.14.0", features = ["ecdsa", "ecdh", "pem"] }
pbkdf2 = "0.13.0"
pkcs8 = { version = "0.11.0", features = ["encryption", "getrandom", "pem"] }
rand_core = "0.10.1"
rsa = { version = "0.10.0-rc.19", features = ["sha2"] }
scrypt = { version = "0.12.0", features = ["phc", "getrandom"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
sha3 = "0.12.0"
subtle = "2.6.1"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }

ciborium = "0.2.2"
csv = "1.4.0"
percent-encoding = "2.3.2"
rmpv = { version = "1.3.1", features = ["with-serde"] }
serde = "1"
serde-saphyr = "2.0.0"
toml = "1.1.8"
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v4", "v7"] }

brotli = "9.0.0"
flate2 = "1.1.10"
maxminddb = "0.32.0"
delaunator = "1.1.0"
earcutr = "0.5.0"
num-bigint = "0.5.1"
num-integer = "0.1.47"
num-traits = "0.2.19"
rust_decimal = { version = "1.43.0", features = ["maths"] }
async-nats = { version = "0.50.0", default-features = false, features = ["ring", "nuid"] }
rumqttc = { version = "0.25.1", default-features = false, features = ["use-rustls-no-provider", "url"] }
lz4_flex = "0.14.0"
tar = "0.4.46"
zip = { version = "9.1.0", default-features = false, features = ["deflate-flate2", "aes-crypto"] }
zstd = { version = "0.14.3", default-features = false }

bs58 = "0.5.1"
jsonschema = { version = "0.60.1", default-features = false }
quick-xml = "0.42.0"
rust-ini = "0.21.3"

futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hickory-resolver = "0.26.3"
ipnet = "2.12.2"
multer = "3.1.0"
rcgen = { version = "0.14.10", features = ["x509-parser"] }
x509-parser = "0.18"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
webpki-roots = "1.0.11"

bytes = "1.12.1"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server-auto", "http1", "http2"] }

redis = { version = "1.8.0", default-features = false, features = ["tokio-comp", "connection-manager", "cluster-async", "tokio-rustls-comp", "tls-rustls-webpki-roots", "script", "sentinel"] }

fastnoise-lite = "1.1.1"

libc = "0.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

aho-corasick = "1.1.5"
deunicode = "1.6.2"
fluent-bundle = "0.16.0"
fluent-langneg = "0.14.2"
intl_pluralrules = "7.0.2"
unic-langid = "0.9.6"
jiff = { version = "0.2.38", features = ["tzdb-bundle-always"] }
minijinja = { version = "3.0.3", features = ["serde", "json", "loop_controls", "fuel", "urlencode"] }
regex = "1.13.1"
strsim = "0.11.1"
unicode-normalization = "0.1.26"
unicode-segmentation = "1.13.3"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[profile.release.package.hickory-resolver]
opt-level = "s"

[profile.release.package.hickory-proto]
opt-level = "s"

