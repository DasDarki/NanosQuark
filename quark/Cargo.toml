[package]
name = "quark"
description = "A batteries included utility library for the nanos world server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
quark-core.workspace = true
mlua.workspace = true

quark-compression = { workspace = true, optional = true }
quark-crypto = { workspace = true, optional = true }
quark-formats = { workspace = true, optional = true }
quark-net = { workspace = true, optional = true }
quark-testing = { workspace = true, optional = true }

[features]
default = ["compression", "crypto", "formats", "net", "testing"]
compression = ["dep:quark-compression"]
crypto = ["dep:quark-crypto"]
formats = ["dep:quark-formats"]
net = ["dep:quark-net"]
testing = ["dep:quark-testing"]
